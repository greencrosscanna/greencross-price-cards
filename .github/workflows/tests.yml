# ─── greencross-price-cards — tests on every push and PR ───────────────────────────────────────
#
# Runs THE SAME gx-preflight.sh the pre-push hook runs. Not a reimplementation: a second copy of the
# gate drifts from the real one and starts disagreeing with local results, which is how people learn
# to distrust CI.
#
# WHY CI AND NOT JUST THE HOOK. A hook protects pushes from one machine and `git push --no-verify`
# walks past it leaving no trace. On 2026-08-22 the hub's gate turned out to carry a portability bug
# its author's Mac could not express — macOS /bin/sh is bash in POSIX mode, Ubuntu's is dash. CI
# surfaced it on the first foreign run.
#
# `sh` is correct here: gx-preflight.sh is #!/bin/sh and uses no bashisms. Verified by running it
# under dash before writing this file, not assumed.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out greencross-price-cards
        uses: actions/checkout@v7
        with:
          path: greencross-price-cards

      # gx-theme, without which live_price_fallback_test.js cannot read the shared modules this page
      # loads by URL (gx-topnav, gx-session, gx-stores, …) and so cannot check their GX Core reads
      # against GX_DEV_READS. That suite calls ok(false) rather than skipping — unreadable is UNKNOWN
      # and unknown fails — which is the RIGHT call and is why this checkout is required, not optional.
      #
      # The suite started reading the sibling in v1.440 and this step did not exist, so from that
      # commit on the gate was green on this desk — where gx-theme is simply the next folder in
      # Dropbox — and red on every push. Code fine, test right, workflow wrong: the kind of red that
      # teaches people to ignore CI. Adding a cross-repo read to a suite means adding its checkout.
      #
      # NO TOKEN NEEDED: greencross-gx-theme is PUBLIC, so the default GITHUB_TOKEN reaches it.
      # The path must sit BESIDE the main checkout, because the test resolves it as ../../ from
      # tests/ — hence `path:` on both steps.
      - name: Check out greencross-gx-theme
        uses: actions/checkout@v7
        with:
          repository: greencrosscanna/greencross-gx-theme
          path: greencross-gx-theme

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Run the gate
        working-directory: greencross-price-cards
        run: sh ./gx-preflight.sh

      # Say what did NOT run. A green tick reports that every test EXITED 0, which is not the same
      # as every test having COVERED something: a suite that skips prints a pass line and looks
      # identical to one that ran.
      # No suite here SKIPS today — that is exactly why this is worth having while the answer is
      # boring: any ⚠️ that appears later is then real, and arrives without anyone going to look.
      #
      # But "nothing skips" was never the same as "nothing can go uncovered", and this comment used
      # to imply it was. live_price_fallback_test.js reads the gx-theme sibling and, when it is
      # absent, FAILS instead of skipping — so that gap arrives as a red gate above, never as a ⚠️
      # here. This step marks any non-skipping suite ✅ and quotes its last line, so through both
      # red runs it printed "✅ live_price_fallback_test.js — FAILED 1 of 17 assertions". The check
      # mark tracks "did it skip", not "did it pass"; the gate is what answers that. The gx-theme
      # checkout step above is what closes the gap, and if it is ever removed the symptom is a red
      # gate rather than a warning here.
      - name: Report coverage honestly
        if: always()
        working-directory: greencross-price-cards
        run: |
          {
            echo "### Coverage"
            echo ""
            for t in tests/*_test.js; do
              out="$(node "$t" 2>&1 || true)"
              # ONE MARKER, EVERY REPO: a skip is a line whose first non-space word is SKIP.
              # Column 0 means the whole suite could not run; indented means it ran but had to pass
              # over part of itself — so the COUNT matters, not just the fact.
              #
              # This used to be five different greps across eight repos, each matching the PHRASING
              # its own tests happened to use ("not a sibling", "checkout not present", "live-value
              # check skipped") — five guesses at wording that nothing kept in step, and a suite that
              # reworded its skip would silently go back to being reported as having run. Two suites
              # (crew's drift check, spiff's live-value check) were already in that state and were
              # given the marker in the same pass.
              #
              # Case-sensitive on purpose: assertion labels are lowercase prose ("a nameless row is
              # skipped") and a -i match would flag those until nobody read the warning.
              SKIPRE='^SKIP|^ +SKIP '
              n="$(printf '%s' "$out" | grep -cE "$SKIPRE" || true)"
              if [ "${n:-0}" -gt 0 ]; then
                echo "- ⚠️ \`$t\` — **$n SKIPPED**: $(printf '%s' "$out" | grep -E "$SKIPRE" | head -1 | sed 's/^ *//')"
              else
                echo "- ✅ \`$t\` — $(printf '%s' "$out" | tail -1)"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
